name: Bansh Boss v0.1 Android
'on':
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
          curl -fLsS "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fLsS "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          KEY="$RUNNER_TEMP/bansh-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$KEY" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "BASH_KEY=$KEY" >> "$GITHUB_ENV"
          cat > ci_config.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("BASH_KEY"))
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              print("ANDROID_EDITOR_SETTINGS_CONFIGURED")
              quit()
          GDSCRIPT
          timeout 90s godot --headless --editor --path . --script res://ci_config.gd 2>&1 | tee build/config.log
          grep -q ANDROID_EDITOR_SETTINGS_CONFIGURED build/config.log
          rm ci_config.gd
          python3 - <<'PYSET'
          import os,re
          from pathlib import Path
          p=Path('export_presets.cfg')
          s=p.read_text()
          for k,v in [('keystore/debug',os.environ['BASH_KEY']),('keystore/debug_user','androiddebugkey'),('keystore/debug_password','android')]:
              pat=r'^'+re.escape(k)+r'\s*=.*$'
              if not re.search(pat,s,re.M): raise SystemExit('Missing '+k)
              s=re.sub(pat,lambda _:k+'="'+v+'"',s,count=1,flags=re.M)
          p.write_text(s)
          PYSET
      - name: Verify configuration and import
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f main.tscn
          test -f scripts/main.gd
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          timeout 150s godot --headless --editor --path . --import 2>&1 | tee build/import.log
      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s godot --headless --editor --verbose --path . --export-debug Android build/Bansh-Boss-v0.1.apk 2>&1 | tee build/export.log
          test -s build/Bansh-Boss-v0.1.apk
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bansh-v01-logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bansh-v01-APK
          path: build/Bansh-Boss-v0.1.apk
          if-no-files-found: error
