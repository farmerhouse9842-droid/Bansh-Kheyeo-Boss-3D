name: Bansh Boss Android APK (test)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOL=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$TOOL"
          yes | "$TOOL" --sdk_root="$SDK" --licenses > /dev/null || true
          "$TOOL" --sdk_root="$SDK" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install matching Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2-stable
          BASE="https://github.com/godotengine/godot-builds/releases/download/$VERSION"
          curl -fL --retry 3 "$BASE/Godot_v${VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/tpl
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --headless --version
      - name: Configure debug signing and Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          python3 - <<'PYSET'
          import os,re
          from pathlib import Path
          p=Path.home()/'.config/godot/editor_settings-4.tres'
          p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'+ '\n'.join(f'{k} = "{v}"' for k,v in {
          'export/android/android_sdk_path':os.environ['ANDROID_HOME'],
          'export/android/java_sdk_path':os.environ['JAVA_HOME'],
          'export/android/debug_keystore':str(Path.home()/'.android/debug.keystore'),
          'export/android/debug_keystore_user':'androiddebugkey',
          'export/android/debug_keystore_pass':'android'}.items())+'\n')
          print('Editor settings file:',p)
          PYSET
      - name: Validate project and import
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          grep -q 'name="Android"' export_presets.cfg
          timeout 150s godot --headless --editor --path . --import 2>&1 | tee build/import.log
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s godot --headless --path . --export-debug Android build/Bansh-Boss-v0.4.apk 2>&1 | tee build/export.log
          test -s build/Bansh-Boss-v0.4.apk
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bansh-v04-build-logs
          path: build/*.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bansh-Boss-v0.4-APK
          path: build/Bansh-Boss-v0.4.apk
